spring.application.name=CrudServiceProject

server.port=8081

# PostgreSQL Configuration
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/exam_2400032187}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Eureka Configuration 
eureka.client.enabled=false

# Actuator Configuration
management.info.env.enabled=true
management.endpoints.web.exposure.include=*

# Application Information
info.app.name=crud-service-project
info.app.description=crud service project
info.app.author=Junelia Samaddar
info.app.version=1.0