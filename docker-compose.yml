services:
  postgres:
    image: postgres:16-alpine
    container_name: blooddonation-postgres
    environment:
      POSTGRES_DB: exam_2400032187
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d exam_2400032187"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: juneliasamaddar/docker-backend-2400032187:latest
    build:
      context: ./backend
      dockerfile: backend.Dockerfile
    container_name: blooddonation-backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/exam_2400032187
      DB_USERNAME: postgres
      DB_PASSWORD: root
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  frontend:
    image: juneliasamaddar/docker-frontend-2400032187:latest
    build:
      context: ./frontend
      dockerfile: frontend.Dockerfile
    container_name: blooddonation-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: on-failure

volumes:
  postgres_data: